
<html lang="en">
<head>
   
    <title>Greeting Changer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="gabriel">Click to Greet</button>

    <div id="rhino">hellloo</div>

    <script>
        const greetings = ["Ni Hao", "Konnichiwa", "Hola"];

        function randomFrom(list) {
            return list[Math.floor(Math.random() * list.length)];
        }

        function randomColor() {
            return `hsl(${Math.random() * 360}, 70%, 75%)`;
        }

        function big() {
            rhino.textContent = randomFrom(greetings);
            rhino.style.setProperty("--bg", randomColor());
            rhino.style.setProperty("--fg", randomColor());
            rhino.style.setProperty("--size", 20 + Math.random() * 80 + "px");
            rhino.classList.toggle("lol");
        }

        big();
        gabriel.addEventListener("click", big);
    </script>

</body>
</html>
